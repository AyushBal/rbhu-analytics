# One-command local stack:  docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:4000/docs
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: rbhu, POSTGRES_PASSWORD: rbhu, POSTGRES_DB: rbhu }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rbhu"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  analytics:
    build: ./analytics
    environment: { CORS_ORIGINS: "http://localhost:8080" }
    ports: ["5001:5001"]

  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rbhu:rbhu@db:5432/rbhu?schema=public
      JWT_SECRET: local-compose-secret-change-me-please-123
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ANALYTICS_URL: http://analytics:5001
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["4000:4000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
